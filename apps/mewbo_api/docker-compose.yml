services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.api
    ports:
      - "5124:5124"
    volumes:
      # Writable: PATCH /api/config persists app.json back here, so a read-only
      # mount makes every settings save fail. Mount the directory, not app.json
      # itself — a config write renames a temp file over the target, and that
      # fails with EBUSY when the target is its own bind-mount point.
      - ../../configs:/app/configs
      - api-data:/app/data
    environment:
      - MEWBO_MASTER_API_TOKEN=${MEWBO_MASTER_API_TOKEN:-msk-strong-password}

  console:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.console
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
