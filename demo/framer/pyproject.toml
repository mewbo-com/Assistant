[project]
name = "mewbo-demo-framer"
version = "0.1.0"
description = "Composite raw doc captures onto a 16:9 wallpaper canvas"
requires-python = ">=3.10"
dependencies = [
    "pillow>=11",
    "pydantic>=2.7",
]

[project.scripts]
mewbo-demo-frame = "mewbo_demo_framer.__main__:main"
# A separate entry point rather than a subcommand: `make demo-frame` invokes
# `mewbo-demo-frame` bare, and adding a required subcommand there would break it.
mewbo-demo-frame-video = "mewbo_demo_framer.video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mewbo_demo_framer"]
