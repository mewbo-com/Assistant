<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Self-contained fontconfig config for rasterizing the CLI terminal SVGs.

  Deliberately does NOT <include> the system fontconfig tree. The only <dir>
  below is this directory, so "Fira Code" can resolve to nothing but the
  vendored FiraCode Nerd Font Mono files sitting next to this file — never to
  whatever may or may not be installed on the machine running the render.
  Point FONTCONFIG_FILE at this file before rasterizing.

  The SVGs declare `font-family: "Fira Code"` (cairosvg's toy text API reads
  only the first family in the list, ignoring the `monospace` fallback), but
  no font distributes under that literal family name with the Nerd Font glyph
  set the SVGs also need — so this alias rewrites that request onto the
  vendored family before fontconfig ever searches for a match.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <match target="pattern">
    <test name="family"><string>Fira Code</string></test>
    <edit name="family" mode="assign" binding="same"><string>FiraCode Nerd Font Mono</string></edit>
  </match>
</fontconfig>
